<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<title>Account confirmed</title>
<style>
  :root{--bg:#0f0f10;--card:#1a1a1c;--line:#34343a;--txt:#f3eee3;--mut:#a49f94;--gold:#c9a24b;--ok:#3fb27f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
  .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;line-height:64px;margin:0 auto 14px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:var(--mut);margin:0 0 20px}
  a.btn{display:block;padding:14px;border-radius:12px;background:var(--gold);color:#111;font-weight:700;text-decoration:none}
  small{display:block;margin-top:14px;color:var(--mut)}
</style>
</head>
<body>
<div class="card">
  <div class="tick">&#10003;</div>
  <h1>Your account is set up</h1>
  <p>Your email address is confirmed. Log in with your email and password to start your free trial.</p>
  <a class="btn" id="go" href="./">Open the app and log in</a>
  <small>You only need to do this once.</small>
</div>
<script>try{history.replaceState(null,'',location.pathname)}catch(e){}</script>
</body>
</html>
